<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>R1 Camera</title>
  <link rel="stylesheet" href="../../lib/fonts/fonts.css">
  <link rel="stylesheet" href="../../lib/shared/reset.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section id="screen-capture" class="screen active">
    <div id="viewfinder">
      <video id="cam" autoplay playsinline muted></video>
      <div class="guides"></div>
      <div class="switch-pulse" id="switch-pulse"></div>
      <div class="flash" id="flash"></div>
      <div class="err" id="cam-err" style="display:none"></div>
      <div class="prompt" id="cam-prompt"></div>
      <div class="screen-flash" id="screen-flash"></div>
    </div>
    <div class="shutter">
      <button class="iconbtn" id="to-gallery" aria-label="gallery">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      <div class="shutter-btn" id="shutter"></div>
      <button class="iconbtn" id="flash-toggle" aria-label="flash" style="display:none">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
        </svg>
      </button>
    </div>
  </section>

  <section id="screen-grid" class="screen">
    <div class="topbar">
      <span class="count" id="gal-meta">0</span>
      <button class="topbtn" id="to-camera" aria-label="back to camera">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <circle cx="12" cy="12.5" r="3.2"/>
        </svg>
      </button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="gal-bar">
      <button class="gal-btn" id="sel-all">select all</button>
      <button class="gal-btn" id="clear-sel">cancel</button>
      <button class="gal-btn danger" id="del-sel">delete</button>
    </div>
  </section>

  <section id="screen-full" class="screen">
    <div class="topbar">
      <span class="tag" id="full-tag">photo</span>
      <span class="meta" id="full-meta">1/1</span>
      <button class="topbtn" id="full-back" aria-label="back to grid">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>
    <div class="stage"><img id="full-img" alt=""></div>
  </section>

  <div class="banner" id="banner"></div>
  <div class="devbar" id="devbar">
    <button data-d="up">wheel▲</button>
    <button data-d="down">wheel▼</button>
    <button data-d="ptt">PTT</button>
    <button data-d="long">LONG</button>
  </div>

  <script src="../../lib/shared/core.js"></script>
  <script src="../../lib/shared/store.js"></script>
  <script src="app.js"></script>
</body>
</html>
