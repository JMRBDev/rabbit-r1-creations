<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 240px;
      height: 282px;
      overflow: hidden;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      width: 240px;
      height: 282px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      gap: 10px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    h1 .accent { color: #FE5000; }
    #subtitle {
      font-size: 11px;
      color: #9a9a9a;
      line-height: 1.4;
    }
    #counter {
      font-size: 13px;
      font-weight: 600;
      color: #FE5000;
      font-variant-numeric: tabular-nums;
      min-height: 16px;
    }
    #hint {
      font-size: 10px;
      color: #6a6a6a;
      line-height: 1.45;
      max-width: 200px;
    }
    #status {
      font-size: 10px;
      color: #FE5000;
      min-height: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Hello,<br><span class="accent">World!</span></h1>
    <p id="subtitle">my first r1 creation</p>
    <div id="counter">scroll: 0</div>
    <p id="hint">scroll wheel to count<br>press side button to speak</p>
    <div id="status"></div>
  </div>

  <script>
    const hasSDK = typeof PluginMessageHandler !== 'undefined';
    let count = 0;
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status');

    function flashStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      clearTimeout(flashStatus._t);
      flashStatus._t = setTimeout(() => statusEl.classList.remove('show'), 1500);
    }

    window.addEventListener('scrollUp', () => {
      count++;
      counterEl.textContent = 'scroll: ' + count;
    });

    window.addEventListener('scrollDown', () => {
      count--;
      counterEl.textContent = 'scroll: ' + count;
    });

    window.addEventListener('sideClick', () => {
      if (hasSDK) {
        PluginMessageHandler.postMessage(JSON.stringify({
          message: 'Say hello world, in one short cheerful sentence.',
          useLLM: true,
          wantsR1Response: true
        }));
        flashStatus('speaking...');
      } else {
        flashStatus('open on r1');
      }
    });

    window.onPluginMessage = function (data) {
      flashStatus('got reply');
    };

    if (!hasSDK) {
      document.getElementById('hint').textContent =
        'run on an r1 device to enable hardware + voice';
    }
  </script>
</body>
</html>
